# @package _global_
general:
    name : 'switches_generation_uncond'
    gpus : 1
    wandb: 'disabled'
    resume: null            # If resume, path to ckpt file from outputs directory in main directory
    test_only: ${oc.env:WORK}/dicrn/2026-01-27/16-21-11-switches_reduced_reactions/checkpoints/switches_reduced_reactions/last.ckpt
    check_val_every_n_epochs: 2
    sample_every_val: 4
    samples_to_generate: 30
    samples_to_save: 9
    chains_to_save: 1
    final_model_samples_to_generate: 1000
    final_model_samples_to_save: 1000
    final_model_chains_to_save: 20
train:
    n_epochs: 100
    batch_size: 100
    save_model: True
model:
    diffusion_steps: 1000
    n_layers: 8
    lambda_train: [5, 0]
    extra_features: null

    # Do not set hidden_mlp_E, dim_ffE too high, computing large tensors on the edges is costly
    # At the moment (03/08), y contains quite little information
    hidden_mlp_dims: { 'X': 128, 'E': 64, 'y': 128 }

    # The dimensions should satisfy dx % n_head == 0
    hidden_dims: { 'dx': 256, 'de': 64, 'dy': 64, 'n_head': 8, 'dim_ffX': 256, 'dim_ffE': 64, 'dim_ffy': 256 }
hydra:
  run:
    dir: ${oc.env:WORK}/dicrn/generation/${general.name}-${now:%Y-%m-%d}-${now:%H-%M-%S}

# @package _global_
general:
    name : 'guidance'
    gpus : 1
    wandb: 'disabled'
    sample_every_val: 1
    samples_to_generate: 10
    final_model_samples_to_generate: 10
    final_model_chains_to_save: 0
    samples_to_save: 2
    chains_to_save: 0
    number_chain_steps: 10        # Number of frames in each gif
    # THIS SHOULD BE THE SAME AS THE REGRESSION MODEL THAT IS LOADED
    guidance_target: 'propensity'            # 'mu', 'homo', 'both', 'no-target'
    target_value: 1.0
    trained_regressor_path: ${oc.env:WORK}/dicrn/2026-01-27/16-19-31-regressor/checkpoints/regressor/last.ckpt
    test_only: ${oc.env:WORK}/dicrn/2026-01-27/16-21-11-switches_reduced_reactions/checkpoints/switches_reduced_reactions/last.ckpt
train:
    batch_size: 1               # Needs to be 1 for testing
    save_model: False
model:
    n_layers: 2
    extra_features: null
guidance:
    lambda_guidance: 300.0
    n_experiments: 2          # Change to 100
dataset:
    remove_h: True
hydra:
  run:
    dir: ${oc.env:WORK}/dicrn/generation/${general.name}-${general.guidance_target}-${general.target_value}-${now:%Y-%m-%d}-${now:%H-%M-%S}
